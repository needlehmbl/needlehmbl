name: Update More repos

on:
  schedule:
    - cron: "0 0 * * *" # daily; profile repo rarely pushes so this catches new repos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-more-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate More repos table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-more-repos.py
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-update More repos section"
          git push
